# Include inside the TLS server for audio.21ideas.org, before its fallback 404.
# Published MP3s are immutable; replacement bytes require a new -vN filename.
location ~ "^/podcasts/books/(?<book_series>[a-z0-9]+(?:-[a-z0-9]+)*)/(?<book_file>chapter-[0-9]{2,3}(?:-v(?:[2-9]|[1-9][0-9]+))?\.mp3)$" {
    alias /srv/media/static/podcasts/books/$book_series/$book_file;
    default_type audio/mpeg;
    autoindex off;
    limit_except GET { deny all; }
    limit_conn perip 24;
    limit_req zone=perip_req burst=60 nodelay;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
