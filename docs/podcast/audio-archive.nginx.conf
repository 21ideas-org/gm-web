# Include inside the TLS server for audio.21ideas.org, before its fallback 404.
# Archive filenames are immutable; replacement bytes must use a new versioned name.
location ~ "^/podcasts/archive/(?<archive_file>[0-9]{4}-[0-9]{2}-[0-9]{2}(?:-v(?:[2-9]|[1-9][0-9]+))?\.(?:mp3|m4a))$" {
    alias /srv/media/static/podcasts/archive/$archive_file;
    types { audio/mpeg mp3; audio/x-m4a m4a; }
    default_type application/octet-stream;
    autoindex off;
    limit_except GET { deny all; }
    limit_conn perip 24;
    limit_req zone=perip_req burst=60 nodelay;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
