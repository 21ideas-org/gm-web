name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  # Notify IndexNow (Yandex + Bing, one shared endpoint) of new/changed digests.
  # Runs AFTER deploy so the URLs are live when engines fetch to verify.
  # The IndexNow key is public by protocol design — not a secret.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2 # need the previous commit to diff
      - name: Ping IndexNow for new/changed digests
        env:
          KEY: "780de8aa80b33db923a259bda6278256" # public IndexNow key (not a secret)
          HOST: "gm.21ideas.org"
        run: |
          BEFORE="${{ github.event.before }}"
          # guard against the all-zero SHA on first push / new branch / manual dispatch
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE="HEAD~1"; fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- src/content/digests/ | grep '\.md$' || true)
          submit() { curl -fsS "https://api.indexnow.org/indexnow?url=$1&key=$KEY&keyLocation=https://$HOST/$KEY.txt" && echo " ✓ $1" || echo " ✗ $1"; }
          if [ -n "$CHANGED" ]; then
            for f in $CHANGED; do submit "https://$HOST/digests/$(basename "$f" .md)/"; done
            # the listings changed too
            submit "https://$HOST/"
            submit "https://$HOST/digests/"
          else
            echo "no digest changes — nothing to submit"
          fi
