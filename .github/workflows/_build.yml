name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build Astro site
        run: npm run build

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # No --include-verbatim: it makes lychee scan inside <script>/<style>, where the about
          # page's FAQPage JSON-LD embeds JSON-escaped anchor HTML (href=\"https://…\"). lychee
          # reads the backslash-quotes as part of the URL and reports bogus file-not-found errors.
          # The real navigable <a> links (visible FAQ included) are still checked without it.
          args: --no-progress --offline --root-dir dist dist/**/*.html
          fail: true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
